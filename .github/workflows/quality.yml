name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics:
    name: Analytics and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
          cache: pip
      - name: Install pinned analytics dependencies
        run: python -m pip install -r requirements.txt
      - name: Check documentation links
        run: python -B scripts/check_documentation.py
      - name: Run regression suite
        run: python -B -m pytest tests/ -q -p no:cacheprovider
      - name: Validate publication outputs
        run: python -B scripts/pll_validate_publication.py
      - name: Verify frozen data was not changed
        if: always()
        run: |
          git diff --stat -- data/
          git diff -- data/ | head -n 120 || true
          git diff --quiet -- data/

  frontend:
    name: Frontend data contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Build local frontend
        run: python -B frontend/scripts/build.py
      - name: Test interface data logic
        run: node --test frontend/tests/data.test.mjs
      - name: Compare bundle against source tables
        run: python -B frontend/tests/test_sources.py
